# Include the log_format in Nginx's http context. Query strings and referrers
# are deliberately omitted. Field names match the Hostwatch traffic reader.
log_format gopherforge_hostwatch escape=json
  '{"ts":"$time_iso8601","request_id":"$request_id",'
  '"host":"$host","method":"$request_method","uri":"$uri",'
  '"uri_provenance":"nginx_normalized_uri","request_uri":"$uri",'
  '"query_present":false,"query_args":"","client_ip":"$remote_addr",'
  '"status":$status,"bytes":$bytes_sent,"request_bytes":$request_length,'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
  '"upstream_status":"$upstream_status","user_agent":"$http_user_agent"}';

server {
  listen 80;
  listen [::]:80;
  server_name gopherforge.app www.gopherforge.app;
  access_log /var/log/nginx/gopherforge.access.json gopherforge_hostwatch;
  access_log /var/log/nginx/hostwatch.json.log gopherforge_hostwatch;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://gopherforge.app$request_uri; }
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.gopherforge.app;
  access_log /var/log/nginx/gopherforge.access.json gopherforge_hostwatch;
  access_log /var/log/nginx/hostwatch.json.log gopherforge_hostwatch;
  ssl_certificate /etc/letsencrypt/live/gopherforge.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gopherforge.app/privkey.pem;
  return 301 https://gopherforge.app$request_uri;
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name gopherforge.app;
  ssl_certificate /etc/letsencrypt/live/gopherforge.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gopherforge.app/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log /var/log/nginx/gopherforge.access.json gopherforge_hostwatch;
  # This installed agent tails one shared stream; site identity comes from host.
  access_log /var/log/nginx/hostwatch.json.log gopherforge_hostwatch;
  error_log /var/log/nginx/gopherforge.error.log warn;
  client_max_body_size 1m;
  location / {
    proxy_pass http://127.0.0.1:3047;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_buffering off;
  }
}
